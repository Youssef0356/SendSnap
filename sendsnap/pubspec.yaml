name: sendsnap
description: "SendSnap - Fast Nearby File Share"
publish_to: 'none'
version: 2.1.0+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  file_picker: ^8.1.7
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1
  device_info_plus: ^11.2.0
  google_mobile_ads: ^5.3.0
  url_launcher: ^6.3.1
  nearby_connections: ^4.3.0
  async: ^2.11.0
  uuid: ^4.5.1
  intl: ^0.19.0
  dio: ^5.7.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
